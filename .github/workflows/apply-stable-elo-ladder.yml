name: Apply stable Elo ladder probing

on:
  push:
    branches: [prompt-15-onnx-inference]
    paths:
      - '.github/scripts/patch_stable_elo_ladder.py'
      - '.github/workflows/apply-stable-elo-ladder.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prompt-15-onnx-inference
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/patch_stable_elo_ladder.py
      - name: Remove one-shot helpers
        run: rm .github/scripts/patch_stable_elo_ladder.py .github/workflows/apply-stable-elo-ladder.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stabilize adaptive Elo ladder probing'
          git push origin prompt-15-onnx-inference
