name: Apply Elo ladder range fix
on:
  push:
    paths: ['.github/workflows/apply-elo-ladder-range-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: prompt-15-onnx-inference}
      - name: Patch adaptive ladder
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('python/match_runner/elo_ladder.py')
          s=p.read_text()
          s=s.replace('DEFAULT_STOCKFISH_LEVELS = (1400, 1600, 1800, 2000, 2200, 2400, 2600, 2800, 3000, 3190)',
                      'DEFAULT_STOCKFISH_LEVELS = (1320, 1400, 1600, 1800, 2000, 2200, 2400, 2600, 2800, 3000, 3190)')
          s=s.replace('    validate_stockfish: bool = True\n', '    validate_stockfish: bool = True\n    start_elo: int = 1800\n')
          s=s.replace('''class LadderResult:\n    estimated_elo: float\n    confidence_lower: float\n    confidence_upper: float\n    confidence: float\n    total_games: int\n    points: list[LadderPoint]\n    report_json: str\n''', '''class LadderResult:\n    estimated_elo: float | None\n    confidence_lower: float | None\n    confidence_upper: float | None\n    confidence: float\n    total_games: int\n    points: list[LadderPoint]\n    report_json: str\n    range_status: str = "in_range"\n    range_bound: int | None = None\n''')
          s=s.replace('''    # A binary search is a poor fit for tiny match samples: a noisy 5/8 at\n    # one level can otherwise jump several hundred Elo in one step. Start near\n    # the middle of the ladder and walk only one level (normally 200 Elo) at a\n    # time. Scores close enough to 50% are confirmed with extra games before\n    # deciding which direction to move.\n    idx = len(config.levels) // 2\n''', '''    # Start near a caller-selected anchor (1800 by default), then walk one\n    # calibrated level at a time. This avoids wasting games at 2400+ when we\n    # already expect the tested engine to be around club-player strength.\n    idx = min(range(len(config.levels)), key=lambda i: abs(config.levels[i] - config.start_elo))\n''')
          old='''        visited_indices.add(idx)\n        if next_idx < 0 or next_idx >= len(config.levels) or next_idx in visited_indices:\n            target_idx = idx\n            break\n'''
          new='''        visited_indices.add(idx)\n        if next_idx < 0:\n            target_idx = idx\n            range_status = "below_range"\n            break\n        if next_idx >= len(config.levels):\n            target_idx = idx\n            range_status = "above_range"\n            break\n        if next_idx in visited_indices:\n            target_idx = idx\n            break\n'''
          s=s.replace('    confirmation_games = max(config.probe_games * 2, min(config.refine_games, 16))\n', '    confirmation_games = max(config.probe_games * 2, min(config.refine_games, 16))\n    range_status = "in_range"\n')
          if old not in s: raise SystemExit('boundary block not found')
          s=s.replace(old,new)
          old='''    refine_indices = sorted({i for i in (target_idx - 1, target_idx, target_idx + 1)\n                             if 0 <= i < len(config.levels)})\n    emit("Refining around the estimated strength region...")\n    for idx in refine_indices:\n        level = config.levels[idx]\n        already = points[level].games\n        if already < config.refine_games:\n            sample(level, config.refine_games - already)\n\n    used_points = [points[level] for level in config.levels if points[level].games]\n    estimate = estimate_elo(used_points, config.confidence)\n'''
          new='''    if range_status == "in_range":\n        refine_indices = sorted({i for i in (target_idx - 1, target_idx, target_idx + 1)\n                                 if 0 <= i < len(config.levels)})\n        emit("Refining around the estimated strength region...")\n        for refine_idx in refine_indices:\n            level = config.levels[refine_idx]\n            already = points[level].games\n            if already < config.refine_games:\n                sample(level, config.refine_games - already)\n    else:\n        bound = config.levels[0] if range_status == "below_range" else config.levels[-1]\n        relation = "below" if range_status == "below_range" else "above"\n        emit(f"Strength is clearly {relation} the calibrated Stockfish range; stopping without refinement.")\n        emit(f"Result will be reported as {'<' if range_status == 'below_range' else '>'}{bound} Elo.")\n\n    used_points = [points[level] for level in config.levels if points[level].games]\n    estimate = estimate_elo(used_points, config.confidence) if range_status == "in_range" else None\n'''
          if old not in s: raise SystemExit('refine block not found')
          s=s.replace(old,new)
          s=s.replace('''        "confidence": config.confidence,\n        "estimate": asdict(estimate),\n        "points": [asdict(point) for point in used_points],\n''', '''        "confidence": config.confidence,\n        "start_elo": config.start_elo,\n        "range_status": range_status,\n        "range_bound": (config.levels[0] if range_status == "below_range" else config.levels[-1] if range_status == "above_range" else None),\n        "estimate": asdict(estimate) if estimate is not None else None,\n        "points": [asdict(point) for point in used_points],\n''')
          old='''    emit(\n        f"Estimated Elo {estimate.elo:.0f}; {config.confidence*100:.0f}% CI "\n        f"{estimate.lower:.0f}..{estimate.upper:.0f}; {estimate.games} games."\n    )\n\n    return LadderResult(\n        estimated_elo=estimate.elo,\n        confidence_lower=estimate.lower,\n        confidence_upper=estimate.upper,\n        confidence=config.confidence,\n        total_games=estimate.games,\n        points=used_points,\n        report_json=str(report_path),\n    )\n'''
          new='''    total_games = sum(point.games for point in used_points)\n    if estimate is not None:\n        emit(\n            f"Estimated Elo {estimate.elo:.0f}; {config.confidence*100:.0f}% CI "\n            f"{estimate.lower:.0f}..{estimate.upper:.0f}; {estimate.games} games."\n        )\n    else:\n        bound = config.levels[0] if range_status == "below_range" else config.levels[-1]\n        relation = "<" if range_status == "below_range" else ">"\n        emit(f"Estimated Elo: {relation}{bound} (outside calibrated Stockfish range); {total_games} games.")\n\n    return LadderResult(\n        estimated_elo=estimate.elo if estimate is not None else None,\n        confidence_lower=estimate.lower if estimate is not None else None,\n        confidence_upper=estimate.upper if estimate is not None else None,\n        confidence=config.confidence,\n        total_games=total_games,\n        points=used_points,\n        report_json=str(report_path),\n        range_status=range_status,\n        range_bound=(config.levels[0] if range_status == "below_range" else config.levels[-1] if range_status == "above_range" else None),\n    )\n'''
          if old not in s: raise SystemExit('result block not found')
          p.write_text(s.replace(old,new), encoding='utf-8')

          p=Path('python/match_runner/ladder_cli.py')
          s=p.read_text()
          s=s.replace('    p.add_argument("--probe-games", type=int, default=8)\n', '    p.add_argument("--probe-games", type=int, default=8)\n    p.add_argument("--start-elo", type=int, default=1800)\n')
          s=s.replace('        probe_games=args.probe_games,\n', '        probe_games=args.probe_games,\n        start_elo=args.start_elo,\n')
          old='''    print(\n        f"Estimated Stockfish-equivalent Elo: {result.estimated_elo:.0f} "\n        f"({pct:.0f}% CI {result.confidence_lower:.0f}..{result.confidence_upper:.0f})", flush=True\n    )\n'''
          new='''    if result.range_status == "in_range":\n        print(\n            f"Estimated Stockfish-equivalent Elo: {result.estimated_elo:.0f} "\n            f"({pct:.0f}% CI {result.confidence_lower:.0f}..{result.confidence_upper:.0f})", flush=True\n        )\n    else:\n        relation = "<" if result.range_status == "below_range" else ">"\n        print(f"Estimated Stockfish-equivalent Elo: {relation}{result.range_bound} (outside calibrated range)", flush=True)\n'''
          if old not in s: raise SystemExit('cli result block not found')
          p.write_text(s.replace(old,new), encoding='utf-8')
          PY
      - name: Patch benchmark GUI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('python/gui/benchmark_app.py')
          s=p.read_text()
          s=s.replace('        self.movetime_var = tk.IntVar(value=100)\n', '        self.movetime_var = tk.IntVar(value=100)\n        self.start_elo_var = tk.IntVar(value=int(saved.get("start_elo", 1800)))\n')
          s=s.replace('        for i in range(5):\n            settings.columnconfigure(i, weight=1)\n\n        self._spin(settings, "Move time [ms]", self.movetime_var, 10, 5000, 0)\n        self._spin(settings, "Probe games", self.probe_var, 2, 200, 1, increment=2)\n        self._spin(settings, "Refine games", self.refine_var, 2, 1000, 2, increment=2)\n        self._spin(settings, "Parallel games", self.concurrency_var, 1, 32, 3)\n        self._spin(settings, "Seed", self.seed_var, 0, 1_000_000, 4)\n', '        for i in range(6):\n            settings.columnconfigure(i, weight=1)\n\n        self._spin(settings, "Start Elo", self.start_elo_var, 1320, 3190, 0, increment=20)\n        self._spin(settings, "Move time [ms]", self.movetime_var, 10, 5000, 1)\n        self._spin(settings, "Probe games", self.probe_var, 2, 200, 2, increment=2)\n        self._spin(settings, "Refine games", self.refine_var, 2, 1000, 3, increment=2)\n        self._spin(settings, "Parallel games", self.concurrency_var, 1, 32, 4)\n        self._spin(settings, "Seed", self.seed_var, 0, 1_000_000, 5)\n')
          s=s.replace('            "output": self.output_var.get().strip(),\n', '            "output": self.output_var.get().strip(),\n            "start_elo": str(self.start_elo_var.get()),\n')
          s=s.replace('        self._append(f"  Move time: {self.movetime_var.get()} ms/move")\n', '        self._append(f"  Start Elo:  {self.start_elo_var.get()}")\n        self._append(f"  Move time: {self.movetime_var.get()} ms/move")\n')
          s=s.replace('            "--probe-games", str(self.probe_var.get()),\n', '            "--start-elo", str(self.start_elo_var.get()),\n            "--probe-games", str(self.probe_var.get()),\n')
          p.write_text(s, encoding='utf-8')
          PY
      - run: rm .github/workflows/apply-elo-ladder-range-fix.yml
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Make Elo ladder start configurable and stop cleanly out of range"
          git push
