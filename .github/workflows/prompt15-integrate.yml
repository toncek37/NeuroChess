name: Prompt 15 integrate neural search

on:
  push:
    branches:
      - prompt-15-onnx-inference
    paths:
      - .github/scripts/prompt15_patch.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prompt-15-onnx-inference
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted integration patch
        run: python .github/scripts/prompt15_patch.py
      - name: Remove one-shot integration helpers
        run: rm -f .github/scripts/prompt15_patch.py .github/workflows/prompt15-integrate.yml
      - name: Commit integrated search changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prompt 15: integrate ONNX policy and value into search"
          git push origin HEAD:prompt-15-onnx-inference
