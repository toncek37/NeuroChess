name: Apply root policy guidance

on:
  push:
    branches: [prompt-15-onnx-inference]
    paths:
      - tools/apply_root_policy_guidance.py
      - .github/workflows/apply-root-policy-guidance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prompt-15-onnx-inference
      - name: Apply patch
        run: python tools/apply_root_policy_guidance.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/search/searcher.cpp
          git commit -m "Use one root policy inference for neural guidance"
          git push
