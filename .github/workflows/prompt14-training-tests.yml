name: Prompt 14 training tests

on:
  push:
    branches:
      - prompt-14-pytorch-policy-wdl
  pull_request:
    branches:
      - prompt-13-training-positions

jobs:
  training-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install training test dependencies
        run: python -m pip install torch numpy python-chess
      - name: Run Prompt 14 tests
        env:
          PYTHONPATH: python
        run: python -m unittest python.tests.test_training
