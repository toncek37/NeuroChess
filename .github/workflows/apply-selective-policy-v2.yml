name: Apply selective policy v2

on:
  push:
    branches: [prompt-15-onnx-inference]
    paths:
      - tools/apply_selective_policy_v2.py
      - .github/workflows/apply-selective-policy-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prompt-15-onnx-inference
      - name: Apply patch
        run: python tools/apply_selective_policy_v2.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add include/neurochess/search/searcher.h src/search/searcher.cpp
          git commit -m "Add four-call selective policy search budget"
          git push
