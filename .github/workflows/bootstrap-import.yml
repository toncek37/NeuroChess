name: Bootstrap NeuroChess import

on:
  push:
    paths:
      - '.github/workflows/bootstrap-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify chunks and import source tree
        shell: bash
        run: |
          sha256sum .bootstrap/chunk_*
          wc -c .bootstrap/chunk_*
          echo "ad3505f33412901fdb2c2a9bb7f74a4e32964adfbd235b9b2b50281b477dc204  .bootstrap/chunk_00" | sha256sum -c -
          echo "25246ab790d59eee786cb8e2299157f68a77bee5da7711cf78f4c115e79ae6ad  .bootstrap/chunk_01" | sha256sum -c -
          echo "2d7f6761dab7e5c594c6a50a85d64ab4546aeef23f6158f5f7b0bf8e5f6ca751  .bootstrap/chunk_02" | sha256sum -c -
          echo "aef4682e981df4b383c5843eb9ab3d0c500def03f877c2e66cd6a95da5e9ec6c  .bootstrap/chunk_03" | sha256sum -c -
          echo "cfd17ecf6bfa13869e4f513f23697ee95bef1f42d56e7cad60b6f5fa0bfa331c  .bootstrap/chunk_04" | sha256sum -c -
          echo "649eec268d2c7a85ea64d10492c1263dcaa75ae12886573efdfda83910c561d6  .bootstrap/chunk_05" | sha256sum -c -
          cat .bootstrap/chunk_* > /tmp/neurochess.b64
          echo "68ccc3ba4bf252796a0e9f10804e8c5f771dd7d6ca1c2d4976dc0cdcecfe39bc  /tmp/neurochess.b64" | sha256sum -c -
          base64 -d /tmp/neurochess.b64 > /tmp/neurochess.tar.gz
          echo "1c099a33ff74e6eda0c28ffa4d680858eb268f11cb0e36ce31cb78f8a3f9059f  /tmp/neurochess.tar.gz" | sha256sum -c -
          tar -xzf /tmp/neurochess.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml

      - name: Commit imported project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import NeuroChess v0.12.6 source tree"
          git push origin HEAD:main
