name: Bootstrap NeuroChess import

on:
  push:
    paths:
      - '.github/workflows/bootstrap-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose bootstrap parts
        shell: bash
        run: |
          set -euo pipefail
          for p in .bootstrap/part_00 .bootstrap/part_01 .bootstrap/part_02 .bootstrap/part_03 .bootstrap/part_04 .bootstrap/part_05 .bootstrap/part_06 .bootstrap/part_07 .bootstrap/part_08 .bootstrap/part_09 .bootstrap/part_10; do
            tr -d '\r\n' < "$p" > /tmp/part
            printf '%s ' "$p"
            wc -c < /tmp/part | tr -d '\n'
            printf ' '
            sha256sum /tmp/part | cut -d' ' -f1
          done
