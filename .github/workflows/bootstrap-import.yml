name: Bootstrap NeuroChess import

on:
  push:
    paths:
      - '.github/workflows/bootstrap-import.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check split parts
        shell: bash
        run: |
          set -euo pipefail
          for p in .bootstrap/part_05_0 .bootstrap/part_05_1 .bootstrap/part_05_2 .bootstrap/part_07_0 .bootstrap/part_07_1 .bootstrap/part_07_2 .bootstrap/part_09_0 .bootstrap/part_09_1 .bootstrap/part_09_2 .bootstrap/part_10_0; do
            tr -d '\r\n' < "$p" > /tmp/p
            printf '%s ' "$p"
            wc -c < /tmp/p | tr -d '\n'
            printf ' '
            sha256sum /tmp/p | cut -d' ' -f1
          done
