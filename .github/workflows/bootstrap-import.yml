name: Bootstrap NeuroChess import

on:
  push:
    paths:
      - '.github/workflows/bootstrap-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source tree
        shell: bash
        run: |
          base64 -d .bootstrap/neurochess_v0126.tar.gz.b64 > /tmp/neurochess.tar.gz
          tar -xzf /tmp/neurochess.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml

      - name: Commit imported project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import NeuroChess v0.12.6 source tree"
          git push origin HEAD:main
