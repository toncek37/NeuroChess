name: Apply neural warmup
on:
  push:
    paths: ['.github/workflows/apply-neural-warmup.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: prompt-15-onnx-inference}
      - name: Warm up model on load
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/search/searcher.cpp')
          s=p.read_text()
          old='''bool Searcher::load_neural_model(const std::string& path) {\n    return neural_ && neural_->load_model(path);\n}\n'''
          new='''bool Searcher::load_neural_model(const std::string& path) {\n    if (!neural_ || !neural_->load_model(path)) return false;\n    // ONNX Runtime can pay a substantial one-time cost on the first Run().\n    // Do that before a timed search starts so a 100 ms move budget is not\n    // consumed by runtime initialization rather than chess search.\n    try {\n        core::Board warmup_board;\n        (void)neural_->evaluate(warmup_board);\n    } catch (...) {\n        return false;\n    }\n    return true;\n}\n'''
          if old not in s: raise SystemExit('load_neural_model target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: rm .github/workflows/apply-neural-warmup.yml
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Warm up ONNX inference before timed search"
          git push
